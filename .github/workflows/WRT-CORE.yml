#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string
      WRT_RELEASE_PREFIX:
        required: false
        type: string
      WRT_RELEASE_PRODUCT:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  WRT_RELEASE_PREFIX: ${{inputs.WRT_RELEASE_PREFIX}}
  WRT_RELEASE_PRODUCT: ${{inputs.WRT_RELEASE_PRODUCT}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      # GitHub-hosted runners are ephemeral: avoid a full OS upgrade, which
      # adds no build value and can hang on transient APT mirror/lock issues.
      - name: Remove Firefox
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -yq purge firefox

      - name: Install build prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 -yq update && \
               sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 -yq install dos2unix libfuse-dev; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to install build prerequisites after ${attempt} attempts."
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Initialize ImmortalWrt build environment
        run: |
          curl --fail --show-error --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 300 \
            https://build-scripts.immortalwrt.org/init_build_environment.sh \
            | sudo bash
          sudo systemctl daemon-reload
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Prepare build workspace
        run: |
          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"

      - name: Initialization Values
        run: |
          WRT_DATE="$(TZ=Asia/Shanghai date +'%y.%m.%d-%H.%M.%S')"
          WRT_INFO="${WRT_SOURCE##*/}"
          WRT_RELEASE_NAME="${WRT_RELEASE_PREFIX:-$WRT_CONFIG}_${WRT_RELEASE_PRODUCT:-$WRT_INFO}_${WRT_DATE}"
          echo "WRT_DATE=$WRT_DATE" >> $GITHUB_ENV
          echo "WRT_INFO=$WRT_INFO" >> $GITHUB_ENV
          echo "WRT_RELEASE_NAME=$WRT_RELEASE_NAME" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@main
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skiped done!"
          else
            echo "caches missed!"
          fi

          if ${{steps.check-cache.outputs.cache-hit != 'true'}}; then
            CACHE_LIST=$(gh cache list --key "$WRT_CONFIG-$WRT_INFO" | cut -f 1)
            for CACHE_KEY in $CACHE_LIST; do
              gh cache delete $CACHE_KEY
            done

            echo "caches cleanup done!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc) && make clean -j$(nproc)

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 V=s

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -type f \( -iname '*factory*.bin' -o -iname '*sysupgrade*.bin' \) -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_RELEASE_NAME}}
          name: ${{env.WRT_RELEASE_NAME}}
          files: ./wrt/upload/*.*
          body: |
            ## Linksys MX4200 系列 ImmortalWrt 固件

            本 Release 仅包含以下设备的带 Wi-Fi 固件：
            - Linksys MX4200v1
            - Linksys MX4200v2

            ### 本次构建
            - 上游源码：${{env.WRT_REPO}}
            - 分支：${{env.WRT_BRANCH}}
            - 上游提交：${{env.WRT_HASH}}
            - 配置：${{env.WRT_CONFIG}}
            - 平台：${{env.WRT_TARGET}}
            - 内核版本：${{env.WRT_KVER}}

            ### 默认访问
            - 管理地址：${{env.WRT_IP}}
            - 管理密码：${{env.WRT_PW}}
            - Wi-Fi SSID：${{env.WRT_SSID}}
            - Wi-Fi 密码：${{env.WRT_WORD}}

            ### LuCI 组件
            ${{env.WRT_LIST}}

      - name: Keep Latest MX4200 Release
        if: env.WRT_TEST != 'true'
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          gh release list --json tagName --jq '.[].tagName' | \
            grep '^MX4200_' | \
            grep -Fxv "$WRT_RELEASE_NAME" | \
            xargs -r -n1 gh release delete --cleanup-tag -y
